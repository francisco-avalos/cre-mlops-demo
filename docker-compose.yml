# Two services: a real MLflow tracking/registry server, and the model API that
# pulls its model from that registry. This is the "notebook -> production"
# transition in miniature.
services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    container_name: mlflow-server
    ports:
      - "5001:5000"          # UI at http://localhost:5001
    volumes:
      - ./mlflow-store:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    container_name: cre-risk-api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: cre-default-risk
      MODEL_ALIAS: champion
    depends_on:
      mlflow:
        condition: service_healthy
    restart: unless-stopped
